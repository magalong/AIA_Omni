trigger:
  - main  # 或是改為您的分支名稱，例如 master

pool:
  vmImage: 'ubuntu-latest'

steps:
- task: NodeTool@0
  inputs:
    versionSpec: '20.x'
  displayName: 'Install Node.js'

- script: |
    npm install
  displayName: 'npm install'

- task: WhiteSourceBolt@20
  displayName: 'Run Mend Bolt Security Scan'
