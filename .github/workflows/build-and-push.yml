name: Build and Push Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: omni-app

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # 純測試 build（不需要 secrets）
      # - name: Build Docker Image
      #   uses: docker/build-push-action@v7
      #   with:
      #     context: .
      #     file: omni-api/Dockerfile
      #     push: false
      #     tags: ${{ env.IMAGE_NAME }}:test
      #     cache-from: type=gha
      #     cache-to: type=gha,mode=max

      # ---- ACR push：設好 secrets 後取消下面的註解，刪掉上面的 Build Docker Image ----
      - name: Login to Alibaba Cloud ACR
        uses: docker/login-action@v4
        with:
          registry: gamer-card-registry.cn-shanghai.cr.aliyuncs.com
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      
      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: omni-api/Dockerfile
          push: true
          tags: |
            gamer-card-registry.cn-shanghai.cr.aliyuncs.com/${{ secrets.ACR_NAMESPACE }}/${{ secrets.ACR_REPO }}:latest
            gamer-card-registry.cn-shanghai.cr.aliyuncs.com/${{ secrets.ACR_NAMESPACE }}/${{ secrets.ACR_REPO }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
